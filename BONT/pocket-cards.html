<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BONT · Pocket Cards v2 — Imprimir</title>
<style>
  @page {
    size: A4 landscape;
    margin: 7mm;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: #e8e8e8;
    padding: 10px;
  }

  .section-title {
    text-align: center;
    font-size: 18px; font-weight: 800; color: #c00;
    padding: 10px 0 6px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .section-sub {
    text-align: center;
    font-size: 10px; color: #888;
    margin-bottom: 8px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4mm;
    max-width: 1000px;
    margin: 0 auto;
    page-break-after: always;
  }
  .grid:last-child { page-break-after: avoid; }

  .card {
    border: 0.3mm solid #999;
    border-radius: 2mm;
    background: #fff;
    padding: 3.5mm 4mm;
    position: relative;
    page-break-inside: avoid;
    break-inside: avoid;
    min-height: 48mm;
  }

  .card-label {
    position: absolute;
    top: 0.5mm; right: 1.5mm;
    font-size: 6px; color: #bbb;
    font-weight: 600;
  }
  .card-cut {
    position: absolute;
    top: -1mm; left: -1mm; right: -1mm; bottom: -1mm;
    border: 0.2mm dashed #ccc;
    border-radius: 3mm;
    pointer-events: none;
  }

  /* Front */
  .f-head {
    display: flex; align-items: center; gap: 2mm;
    margin-bottom: 1.5mm;
  }
  .f-ico { font-size: 9mm; line-height: 1; }
  .f-title {
    font-size: 10pt; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.3px;
    line-height: 1.1;
  }
  .f-sub {
    font-size: 6.5pt; color: #888;
    margin-top: 0.3mm; font-weight: 500;
  }

  .f-line { height: 0.3mm; border: none; margin: 1.2mm 0; }

  .f-row {
    display: flex; gap: 1.5mm;
    margin-bottom: 0.8mm;
    font-size: 7.5pt; line-height: 1.3;
    align-items: flex-start;
  }
  .f-lbl {
    font-weight: 700; color: #fff;
    padding: 0.3mm 1.5mm; border-radius: 1.5px;
    white-space: nowrap; min-width: 9mm; text-align: center;
    font-size: 7pt; flex-shrink: 0;
  }
  .f-txt { flex: 1; color: #333; }

  /* Back */
  .b-tit {
    font-size: 8.5pt; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 1mm;
    border-bottom: 0.3mm solid #ddd;
    padding-bottom: 0.5mm;
  }
  .b-steps { list-style: none; }
  .b-step {
    display: flex; gap: 1.5mm; margin-bottom: 0.6mm;
    font-size: 7pt; line-height: 1.3; color: #333;
  }
  .b-num {
    font-weight: 700; min-width: 3mm;
    font-size: 7.5pt; flex-shrink: 0;
  }
  .b-box {
    background: #fff5f5; border-left: 1mm solid #c00;
    padding: 1mm 1.5mm; margin-bottom: 1.2mm;
    font-size: 7.5pt; font-style: italic; color: #333;
    line-height: 1.3;
  }

  .cr .f-title { color: #c62828; }
  .cr .f-line { background: #c62828; }
  .cr .f-lbl { background: #c62828; }
  .cr .b-tit { color: #c62828; }
  .cr .b-num { color: #c62828; }

  .cy .f-title { color: #f57f17; }
  .cy .f-line { background: #f57f17; }
  .cy .f-lbl { background: #f57f17; }
  .cy .b-tit { color: #f57f17; }
  .cy .b-num { color: #f57f17; }

  .cg .f-title { color: #2e7d32; }
  .cg .f-line { background: #2e7d32; }
  .cg .f-lbl { background: #2e7d32; }
  .cg .b-tit { color: #2e7d32; }
  .cg .b-num { color: #2e7d32; }

  .co .f-title { color: #bf360c; }
  .co .f-line { background: #bf360c; }
  .co .f-lbl { background: #bf360c; }
  .co .b-tit { color: #bf360c; }
  .co .b-num { color: #bf360c; }

  .cp .f-title { color: #7b1fa2; }
  .cp .f-line { background: #7b1fa2; }
  .cp .f-lbl { background: #7b1fa2; }
  .cp .b-tit { color: #7b1fa2; }
  .cp .b-num { color: #7b1fa2; }

  .cgold .f-title { color: #c00; }
  .cgold .f-line { background: #c00; }
  .cgold .f-lbl { background: #c00; }
  .cgold .b-tit { color: #c00; }
  .cgold .b-num { color: #c00; }

  @media print {
    body { background: white; padding: 0; }
    .section-title { padding-top: 4px; font-size: 14px; }
    .section-sub { font-size: 8px; margin-bottom: 4px; }
    .card { border-color: #bbb; }
    .card-cut { display: none; }
    .grid { gap: 3mm; }
  }
</style>
</head>
<body>

const LANG_META = {
  es: { flag: "🇪🇸", name: "ESPAÑOL" },
  en: { flag: "🇬🇧", name: "ENGLISH" },
  nl: { flag: "🇳🇱", name: "NEDERLANDS" }
};

function build() {
  const container = document.getElementById("app");
  let html = "";

  for (const [lk, cards] of Object.entries(DATA)) {
    const meta = LANG_META[lk];
    html += `<div class="section-title">🛡️ BONT · Pocket Cards — ${meta.flag} ${meta.name}</div>`;
    html += `<div class="section-sub">Imprime en A4 horizontal · Recorta y plastifica · 6 tarjetas por hoja</div>`;

    // Fronts (first 6 cards)
    html += '<div class="grid">';
    cards.forEach((c, i) => {
      html += `<div class="card ${c.cls}">`;
      html += `<div class="card-label">${lk.toUpperCase()} F${i+1}</div>`;
      html += `<div class="f-head"><span class="f-ico">${c.e}</span><div><div class="f-title">${c.t}</div><div class="f-sub">${c.s}</div></div></div>`;
      html += '<hr class="f-line">';
      c.fl.forEach(r => {
        html += `<div class="f-row"><span class="f-lbl">${r[0]}</span><span class="f-txt">${r[1]}</span></div>`;
      });
      html += '</div>';
    });
    html += '</div>';

    // Backs (next 6 cards)
    html += '<div class="grid">';
    cards.forEach((c, i) => {
      html += `<div class="card ${c.cls}" style="background:#fafafa;">`;
      html += `<div class="card-label">${lk.toUpperCase()} B${i+1}</div>`;
      html += `<div class="b-tit">${c.bt}</div>`;
      html += '<ol class="b-steps">';
      c.bs.forEach((s, j) => {
        html += `<li class="b-step"><span class="b-num">${j+1}.</span><span>${s}</span></li>`;
      });
      html += '</ol></div>';
    });
    html += '</div>';
  }

  // Footer
  html += '<div style="text-align:center;padding:8px;font-size:9pt;color:#888;">📱 App: <a href="https://sacharunaaa-max.github.io/Bont/" style="color:#c00;">sacharunaaa-max.github.io/Bont</a> · v0.1</div>';

  container.innerHTML = html;
}

document.addEventListener("DOMContentLoaded", build);

<div id="app" style="max-width:1000px;margin:0 auto;">
  <div style="text-align:center;padding:20px;color:#888;">Generando...</div>
</div>
